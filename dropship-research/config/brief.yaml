# Research brief. The Lead copies this into runs/<run-id>/brief.md at the start of every run.
# Confirmed with the store owner 2026-09-17. Change it here, not in agent files.
version: 2
changed_2026_09_17: "Marketing switched to paid-ads-first; platform set to Shopify; spend authorization set to zero."

market:
  country: US
  customer: general consumer
  currency: USD

niches_in_scope:
  - home-kitchen-problem-solvers
  - fitness-recovery-accessories   # non-ingestible gear only
  - pet
  - car-accessories

excluded_categories:              # Gate G0. Any match = REJECT.
  - supplements or anything ingestible
  - products that need medical, health or therapeutic claims to sell
  - cosmetics or anything applied to skin
  - electronics with lithium batteries or mains plugs
  - weapons, knives, self-defence items
  - branded, licensed, character or look-alike goods
  - adult products
  - children's toys or products covered by CPSC children's rules
  - anything on the Shopify Payments prohibited list or restricted by Meta/TikTok ad policy

store:
  platform: shopify               # CONFIRMED by owner. Not yet provisioned; no plan purchased.
  payment_processor: shopify-payments
  status: not_provisioned
  blocker: "Shopify requires a paid plan. Spend authorization is zero, so the store cannot be created yet."
  interim: "Build a working local storefront plus Shopify-importable product CSV and theme-ready copy."

price_band_usd: {min: 25, max: 60}
delivery_cap_days_us: 12
tracking_required: true

budgets_usd:
  spend_authorization: 0          # ZERO. Owner approves every spend individually.
  note: "No purchases, no subscriptions, no domains, no AI image credits, no ad spend without explicit per-item approval."

marketing:
  primary: paid-ads               # CONFIRMED: paid ads from day one
  channels: [meta, tiktok]
  organic: supporting only
  implication: "Cold paid traffic must be paid for out of contribution margin, so the economics gate is materially stricter than an organic-first store."

run_limits:
  discovery_max_candidates: 15
  research_max_products_per_run: 8
  fetch_cap_per_agent: {discovery: 40, competitor: 30, supplier: 30, economics: 15}
  minutes_cap_per_agent: {discovery: 25, competitor: 20, supplier: 20, economics: 15}

environment_constraints:
  blocked_domains: [amazon.com, aliexpress.com, etsy.com, walmart.com, temu.com, alibaba.com, cjdropshipping.com, reddit.com, trends.google.com, shopify.com, google.com, duckduckgo.com]
  note: "Verified 2026-09-17 by direct request. Only the Anthropic-side WebSearch tool reaches the open web. Live prices, listings and reviews cannot be opened directly and must be recorded as manual checks."
