# Research brief. The Lead copies this into runs/<run-id>/brief.md at the start of every run.
# Confirmed with the store owner 2026-09-17. Change it here, not in agent files.
version: 3
changed_2026_09_17: "Marketing paid-ads-first; platform Shopify; spend authorization zero."
changed_2026_09_17_b: "Price band raised to 60-120 USD after the 25-60 band was proved unworkable under paid-ads gates. Sourcing stays China-direct by owner decision, with tariff and delivery risks accepted and documented."

market:
  country: US
  customer: general consumer
  currency: USD

niches_in_scope:
  - home-kitchen-problem-solvers
  - fitness-recovery-accessories   # non-ingestible gear only
  - pet
  - car-accessories

excluded_categories:              # Gate G0. Any match = REJECT.
  - supplements or anything ingestible
  - products that need medical, health or therapeutic claims to sell
  - cosmetics or anything applied to skin
  - electronics with lithium batteries or mains plugs
  - weapons, knives, self-defence items
  - branded, licensed, character or look-alike goods
  - adult products
  - children's toys or products covered by CPSC children's rules
  - anything on the Shopify Payments prohibited list or restricted by Meta/TikTok ad policy

store:
  platform: shopify               # CONFIRMED by owner. Not yet provisioned; no plan purchased.
  payment_processor: shopify-payments
  status: not_provisioned
  blocker: "Shopify requires a paid plan. Spend authorization is zero, so the store cannot be created yet."
  interim: "Build a working local storefront plus Shopify-importable product CSV and theme-ready copy."

price_band_usd: {min: 60, max: 120}
price_band_rationale: >
  The 25-60 band was proved unworkable: at $25 the paid-ads gates fail even at zero cost of
  goods, and the one candidate researched in depth had a market ceiling of ~$24 against a
  gate minimum of $45. At 60-120 the gates clear comfortably even with a pessimistic 37.5%
  duty applied.
cost_targets_with_duty:          # max EX-FACTORY goods cost, duty 37.5% on goods, freight $6/unit
  at_60_retail: 12.19
  at_70_retail: 15.05
  at_80_retail: 17.92
  at_90_retail: 20.78
  at_100_retail: 23.64
  at_120_retail: 29.37
  note: "Landed cost lands at ~38-39% of retail across the whole band."

accepted_risks_2026_09_17:
  - risk: "Tariff exposure on China-direct parcels"
    status: "ACCEPTED BY OWNER, UNRESOLVED"
    detail: >
      A percentage duty is absorbed at this band: at 37.5% on goods, $69-119 retail still
      yields $32-55 contribution and break-even ROAS under 2.0. A FLAT per-parcel fee is
      not absorbed and does not scale away: at a $100 flat fee, contribution is -$77.61 at
      $69 retail and still -$36.39 at $119. Raising the band does NOT mitigate this risk.
  - risk: "12-day tracked delivery not dependably achievable China-direct"
    status: "ACCEPTED BY OWNER, UNRESOLVED"
    detail: >
      Economy lines exclude supplier prep and mandatory customs entry. Reliable 12-day
      delivery needs US warehousing, which needs inventory capital. Either the cap is
      relaxed or the promise will be missed, particularly in Q4.
delivery_cap_days_us: 12
tracking_required: true
delivery_finding_2026_09_17: >
  UNRESOLVED. 12 days tracked is not dependably achievable China-direct. Economy lines
  (YunExpress 7-12d, CJPacket 9-22d door-to-door) exclude supplier prep and the new
  mandatory customs entry. Meeting 12 days reliably requires US warehousing, which means
  buying inventory. Sources are logistics-vendor estimates, not measured data.

budgets_usd:
  spend_authorization: 0          # ZERO. Owner approves every spend individually.
  note: "No purchases, no subscriptions, no domains, no AI image credits, no ad spend without explicit per-item approval."

marketing:
  primary: paid-ads               # CONFIRMED: paid ads from day one
  channels: [meta, tiktok]
  organic: supporting only
  implication: "Cold paid traffic must be paid for out of contribution margin, so the economics gate is materially stricter than an organic-first store."

run_limits:
  discovery_max_candidates: 15
  research_max_products_per_run: 8
  fetch_cap_per_agent: {discovery: 40, competitor: 30, supplier: 30, economics: 15}
  minutes_cap_per_agent: {discovery: 25, competitor: 20, supplier: 20, economics: 15}

market_conditions_2026:
  de_minimis_repealed: true
  detail: >
    The US $800 de minimis exemption was withdrawn for China/HK in May 2025, suspended
    worldwide in Aug 2025, and permanently repealed effective July 2027. In 2026 essentially
    every parcel from every country is dutiable regardless of value. Reported rates do not
    reconcile across sources: ~30% via commercial carriers, ~37.5% effective for China,
    and for postal parcels 54% or a $100 FLAT FEE.
  unresolved_and_critical: >
    Whether a $100 flat per-parcel postal fee currently applies. If it does, per-order
    China-direct dropshipping is not marginal for a $49 product, it is dead by ~5x.
    This is a model-level question, not a product-level one. HIGHEST PRIORITY CHECK.
  implication_for_cost_gate: >
    The 38%-of-retail landed cost rule was derived for goods plus inbound freight only.
    It excludes US pick/pack and outbound postage (~$8-12/order on a warehoused model)
    and predates the tariff change. Re-derive before reusing it.

environment_constraints:
  blocked_domains: [amazon.com, aliexpress.com, etsy.com, walmart.com, temu.com, alibaba.com, cjdropshipping.com, reddit.com, trends.google.com, shopify.com, google.com, duckduckgo.com]
  note: "Verified 2026-09-17 by direct request. Only the Anthropic-side WebSearch tool reaches the open web. Live prices, listings and reviews cannot be opened directly and must be recorded as manual checks."
