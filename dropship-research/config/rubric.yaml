# Scoring rubric. Gates first; any FAIL = REJECT and no score is computed. UNKNOWN on a gate = HOLD.
version: 1
gates:
  G0_category:   "Not in config/brief.yaml excluded_categories; does not need health/medical claims"
  G1_ip_legal:   "No brand/licensed/look-alike; no obvious patent-holder product; no CPSC recall hit for this product type"
  G2_safety:     "No fatal safety risk; if sample_required, finalist status is conditional on the sample"
  G3_delivery:   ">= 1 supplier with tracked delivery whose pessimistic estimate <= delivery_cap_days_us"
  G4_economics:  "Base-case contribution >= 12 USD AND >= 35% of price; pessimistic contribution > 0"
  G5_demand:     "Sustained demand: >= 2 independent signals spanning >= 90 days; not a single spike"
  G6_platform:   "Not restricted by Shopify Payments, TikTok Shop/Ads or Meta commerce policy"
economics_floor:
  base_contribution_usd_min: 12       # ASSUMPTION: ~8 orders recover a 100 USD test
  base_margin_pct_min: 35
  pessimistic_contribution_usd_min: 0
weights:                              # sum = 100; each criterion scored 0-10 by the Lead
  demand_strength: 20
  demo_creative_potential: 20
  base_economics: 20
  differentiation_credibility: 15
  supplier_confidence: 15
  competition_intensity_inverse: 10
anchors:
  demand_strength:            {0: "1 weak signal", 5: "2-3 signals, flat", 10: ">= 3 signals rising over 6+ months"}
  demo_creative_potential:    {0: "needs explanation", 5: "visible before/after", 10: "instant 'oh' moment in < 5 s"}
  base_economics:             {0: "at floor", 5: "15-20 USD or 40-50%", 10: "> 20 USD and > 50%"}
  differentiation_credibility: {0: "commodity, no angle", 5: "one plausible angle", 10: "evidence-backed unmet need"}
  supplier_confidence:        {0: "1 supplier, claims only", 5: "2 suppliers, some corroboration", 10: ">= 2 with corroborated reviews/photos"}
  competition_intensity_inverse: {0: "saturated, price war", 5: "moderate", 10: "few credible stores"}
confidence_multiplier: {high: 1.0, medium: 0.85, low: 0.7}
finalist_threshold:
  adjusted_score_min: 60
  confidence_min: medium
  max_finalists: 3
